name: booking-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-booking}
      POSTGRES_USER: ${DB_USER:-booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-booking_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 stores version-specific PGDATA beneath this directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-booking}
      DB_USER: ${DB_USER:-booking}
      DB_PASSWORD: ${DB_PASSWORD:-booking_dev_password}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-booking-local-development-key-change-before-deployment}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      DEMO_USERS_ENABLED: ${DEMO_USERS_ENABLED:-true}
      DEMO_PAYMENTS_ENABLED: ${DEMO_PAYMENTS_ENABLED:-true}
      HOLD_SECONDS: ${HOLD_SECONDS:-600}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      # 綠界設定：在 backend/.env 設定 ECPAY_RETURN_URL = 你的 ngrok 網址 + /api/v1/payments/ecpay/notify
      ECPAY_RETURN_URL: ${ECPAY_RETURN_URL:-}
      ECPAY_ORDER_RESULT_URL: ${ECPAY_ORDER_RESULT_URL:-http://localhost:8080/api/v1/payments/ecpay/result}
      ECPAY_FRONTEND_RESULT_URL: ${ECPAY_FRONTEND_RESULT_URL:-http://localhost:5173/my-bookings}
      ECPAY_ACCEPT_SIMULATED: ${ECPAY_ACCEPT_SIMULATED:-false}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # An isolated database for tests: it never uses the development volume.
  test-db:
    image: postgres:18-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: booking_test
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking_dev_password
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    image: maven:3.9.11-eclipse-temurin-21
    profiles: ["test"]
    working_dir: /workspace
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    environment:
      TEST_DB_HOST: test-db
      TEST_DB_PORT: 5432
    command: ["mvn", "-B", "-ntp", "test"]
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres-data:
  maven-cache:
