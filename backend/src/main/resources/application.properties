spring.application.name=BookingBackend

# Local development defaults match compose.yaml. Environment variables override them.
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:booking}
spring.datasource.username=${DB_USER:booking}
spring.datasource.password=${DB_PASSWORD:booking_dev_password}
spring.datasource.hikari.connection-timeout=3000

# Flyway owns the schema; Hibernate only verifies it and never recreates tables.
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# Only request DTO fields are accepted: clients cannot inject a role/member ID.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
app.security.jwt-secret=${JWT_SECRET:booking-local-development-key-change-before-deployment}
app.security.jwt-issuer=booking-backend
app.security.access-token-seconds=900
app.security.refresh-token-days=7
app.security.secure-cookie=${SECURE_COOKIE:false}
# Demo staff accounts are opt-in for local development (enabled by Compose).
app.demo-users.enabled=${DEMO_USERS_ENABLED:false}
app.booking.hold-seconds=${HOLD_SECONDS:600}
app.demo-payments.enabled=${DEMO_PAYMENTS_ENABLED:false}

# 綠界全方位金流（信用卡）。預設值是綠界「公開」的測試商店 (https://developers.ecpay.com.tw/2856/)；
# 正式上線時必須用環境變數覆蓋成正式的商店代號與金鑰。
app.ecpay.merchant-id=${ECPAY_MERCHANT_ID:3002607}
app.ecpay.hash-key=${ECPAY_HASH_KEY:pwFHCqoQZGmho4w6}
app.ecpay.hash-iv=${ECPAY_HASH_IV:EkRm7iFT261dpevs}
app.ecpay.checkout-url=${ECPAY_CHECKOUT_URL:https://payment-stage.ecpay.com.tw/Cashier/AioCheckOut/V5}
# 綠界伺服器直接呼叫的付款通知網址，必須是公開網址（本機用 ngrok，雲端用 Azure 網址）。留空則停用綠界付款。
app.ecpay.return-url=${ECPAY_RETURN_URL:}
# 付款完成後使用者瀏覽器的導回網址；因為是使用者自己的瀏覽器，填 localhost 也可以。
app.ecpay.order-result-url=${ECPAY_ORDER_RESULT_URL:http://localhost:8080/api/v1/payments/ecpay/result}
app.ecpay.frontend-result-url=${ECPAY_FRONTEND_RESULT_URL:http://localhost:5173/my-bookings}
app.ecpay.min-remaining-seconds=${ECPAY_MIN_REMAINING_SECONDS:180}
# 綠界廠商後台的「模擬付款」沒有實際扣款，只建議在本機實驗時開啟。
app.ecpay.accept-simulated=${ECPAY_ACCEPT_SIMULATED:false}
