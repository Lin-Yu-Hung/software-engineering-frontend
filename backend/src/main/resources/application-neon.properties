# Opt in with SPRING_PROFILES_ACTIVE=neon. Credentials come from neon deploy's env file.
# The initializer routes normal traffic to DATABASE_URL and Flyway to DATABASE_URL_UNPOOLED.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0

# Reads/writes already handle expiration lazily; avoid polling an idle cloud DB every 30 seconds.
# app.booking.expiry-enabled can be overridden to true for an always-running deployment.
app.booking.expiry-enabled=false

# Cloud connections require a new JWT secret, never the local development fallback.
app.security.jwt-secret=${JWT_SECRET}
